# Throttle password guessing on the login endpoint (per client IP).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Dotfiles (.env, .git, .aws, ...) never exist in the SPA build. Without
    # this, scanners probing for them get index.html with a 200 via the SPA
    # fallback below, which looks like a hit and invites more probing.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        gzip_static on;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend "http://backend:8000";
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Video playback: pass bytes straight through. With default buffering nginx
    # spooled every range request of a multi-GB recording into
    # /var/cache/nginx/proxy_temp before sending it on.
    location ~ ^/api/(recordings|clips)/\d+/stream$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend "http://backend:8000";
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        gzip off;
    }

    location /api {
        # Use Docker's embedded DNS so nginx re-resolves the backend IP after
        # container restarts (prevents stale-IP 502s).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend "http://backend:8000";
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # "any": API responses are proxied, and the old list skipped most of them.
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript text/vtt application/json application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Brotli support (if nginx built with ngx_brotli)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
}
