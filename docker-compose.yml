services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camsuite-backend
    restart: unless-stopped
    # Loopback only. The UI's nginx reaches the backend over the Docker
    # network; publishing on all interfaces let internet scanners hit the API
    # directly and bypass nginx.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./recordings:/app/recordings
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./data/camsuite.db
      - RECORDINGS_DIR=/app/recordings
      - DATA_DIR=/app/data
      # Host timezone for recording filenames (F4F_<model>_<local time>.mp4).
      - TZ=${TZ:-UTC}
      # --- Security ---------------------------------------------------
      # Login password. If unset, one is generated on first boot and
      # printed once in the backend logs (`docker compose logs backend`).
      # Set it here or in a .env file next to this compose file.
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Origins allowed to call the API from a browser. Must list the URL
      # you actually open the UI on. Never use "*" -- it is rejected.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      # Set to true once you serve the UI over HTTPS, so the session
      # cookie is only ever sent on encrypted connections.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Interactive API docs at /docs. Off by default.
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      # Simultaneous recordings (each is one ffmpeg process + disk stream).
      - MAX_CONCURRENT_RECORDINGS=${MAX_CONCURRENT_RECORDINGS:-10}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: camsuite-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
